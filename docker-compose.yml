services:
  postgres:
    image: postgres:15-alpine
    container_name: enterprise-llm-postgres
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gateway-network

  redis:
    image: redis:7-alpine
    container_name: enterprise-llm-redis
    ports:
      - "6379:6379"
    networks:
      - gateway-network

networks:
  gateway-network:
    driver: bridge

volumes:
  postgres_data: