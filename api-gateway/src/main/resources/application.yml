spring:
  config:
    import: optional:file:.env
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: core-ai-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/ai/**

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
